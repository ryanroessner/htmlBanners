<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tauck Compass Loader</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
  }

.compass-loader-svg {
  width: 92px;
  height: auto;
}

.compass-loader-dashes{
  transform-box: fill-box;
  transform-origin: center;
  animation: dashesSpin 5s cubic-bezier(.3, .4, .2, 1) infinite;
  will-change: transform;
}

@keyframes dashesSpin {
  0%,
  4% {
    transform: rotate(0deg);
  }

  96%,
  100% {
    transform: rotate(360deg);
  }
}

.compass-loader-rose {
  transform-box: fill-box;
  transform-origin: center;
  animation: compassSpin 5s cubic-bezier(.3, 0, .2, 1) infinite;
  will-change: transform;
}

@keyframes compassSpin {
  0%,
  4% {
    transform: rotate(0deg);
  }

  96%,
  100% {
    transform: rotate(360deg);
  }
}
</style>
</head>
