		/* this function is from The Trade Desk Docs as-is */
		function getParameterByName(name) {
			// Returns the value of URL parameter "name"
			name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
			var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),

<script type='text/javascript'>

function startAd() {
	addEventListeners();
	initAnimation();
};

function initAnimation(){
var bannerTimeline = gsap.timeline();
//bannerTimeline.timeScale(6.5);

//frame1
bannerTimeline.from(".img-1",{duration:7, y:10, scale:1.2, ease:"none",transformOrigin:"50% 50%"},0);

//frame2
bannerTimeline.to(".image-holder-2",{duration:1,alpha:1,  ease: "none"},3.0);
bannerTimeline.to("#headline-1",{duration:.5,alpha:0,  ease: "none"},3.0);
bannerTimeline.to("#headline-2",{duration:.5,alpha:1,  ease: "none"},3.6);
bannerTimeline.to(".img-2",{duration:7,scale:1.1, ease: "none",transformOrigin:"50% 50%"},3);

//frame3
bannerTimeline.to(".image-holder-3",{duration:1,alpha:1,  ease: "none"},7.0);
bannerTimeline.from(".img-3",{duration:7, scale:1.05, ease: "none",transformOrigin:"50% 50%"},7);
bannerTimeline.to("#headline-2",{duration:.5,alpha:0,  ease: "none"},7.0);
bannerTimeline.to("#headline-3",{duration:.5,alpha:1,  ease: "none"},7.6);

//frame4
bannerTimeline.to(".image-holder-4",{duration:1,alpha:1,  ease: "none"},11.0);
bannerTimeline.from(".img-4",{duration:7, scale:1.1, ease: "none",transformOrigin:"50% 50%"},11);
bannerTimeline.to("#headline-3",{duration:.5,alpha:0,  ease: "none"},11.0);
bannerTimeline.to("#headline-4",{duration:.5,alpha:1,  ease: "none"},11.6);
}

function addEventListeners(){
	document.getElementById('banner').addEventListener('click', clickthrough);
	document.getElementById('banner').addEventListener('mouseover', bannerOver);
	document.getElementById('banner').addEventListener('mouseout', bannerOut);
}

function clickthrough(){
	window.open(window.clickTAG);
}
function bannerOver(){
	gsap.to(".CTA",{ duration:.5,scale:1.1,transformOrigin:"center center", ease:"expo.out"});
	
}
function bannerOut(){
	gsap.to(".CTA",{ duration:.5, scale:1,transformOrigin:"center center", ease:"expo.out"});
	
}
window.onload = function () {
	gsap.set('#ad',{duration:0,alpha:1});
	startAd();
};

</script>
