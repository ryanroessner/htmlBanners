<script type='text/javascript'>

function startAd() {
	addEventListeners();
	initAnimation();
};

function initAnimation(){
var bannerTimeline = gsap.timeline();
//bannerTimeline.timeScale(6.5);

//frame1
bannerTimeline.from(".img-0",{duration:7, y:10, scale:1.2, ease:"none",transformOrigin:"50% 50%"},0);


//
//frame2
//bannerTimeline.to(".image-holder-0",{duration:1,alpha:0,  ease: "none"},3.0);
bannerTimeline.to(".image-holder-1",{duration:1,alpha:1,  ease: "none"},3.0);
//bannerTimeline.to(".CTA",{duration:1.5, y:17,  ease:"expo.out"},3.0);
bannerTimeline.to("#headline-0",{duration:.5,alpha:0,  ease: "none"},3.0);
bannerTimeline.to("#headline-1",{duration:.5,alpha:1,  ease: "none"},3.3);
bannerTimeline.to("#SubHead",{duration:.5,alpha:1,  ease: "none"},3.4);
bannerTimeline.to(".img-1",{duration:7,scale:1.1, ease: "none",transformOrigin:"50% 50%"},3);

//frame3
bannerTimeline.to(".image-holder-2",{duration:1,alpha:1,  ease: "none"},6.5);
bannerTimeline.from(".img-2",{duration:7, scale:1.1, ease: "none",transformOrigin:"50% 50%"},5.5);
bannerTimeline.to("#headline-1",{duration:.5,alpha:0,  ease: "none"},6.5);
bannerTimeline.to("#headline-2",{duration:.5,alpha:1,  ease: "none"},7.1);

//frame4
bannerTimeline.to(".image-holder-3",{duration:1,alpha:1,  ease: "none"},10.0);
bannerTimeline.from(".img-3",{duration:7, scale:1.1, ease: "none",transformOrigin:"50% 50%"},10);
bannerTimeline.to("#headline-2",{duration:.5,alpha:0,  ease: "none"},10.0);
bannerTimeline.to("#headline-3",{duration:.5,alpha:1,  ease: "none"},10.6);

//frame5
bannerTimeline.to(".image-holder-4",{duration:1,alpha:1,  ease: "none"},13.5);
bannerTimeline.from(".img-4",{duration:5, scale:1.2, ease:"expo.out",transformOrigin:"50% 50%"},10);
bannerTimeline.to("#headline-3",{duration:.5,alpha:0,  ease: "none"},13.5);
bannerTimeline.to("#headline-0",{duration:.5,alpha:1,  ease: "none"},14);
bannerTimeline.to("#SubHead",{duration:.5,alpha:0,  ease: "none"},13.5);
//bannerTimeline.to(".CTA",{duration:1, y:0,  ease:"expo.out"},14);
}

function addEventListeners(){
	document.getElementById('banner').addEventListener('click', clickthrough);
	document.getElementById('banner').addEventListener('mouseover', bannerOver);
	document.getElementById('banner').addEventListener('mouseout', bannerOut);
}

function clickthrough(){
	window.open(window.clickTAG);
}
function bannerOver(){
	gsap.to(".CTA",{ duration:.5,scale:1.1,transformOrigin:"center center", ease:"expo.out"});
	
}
function bannerOut(){
	gsap.to(".CTA",{ duration:.5, scale:1,transformOrigin:"center center", ease:"expo.out"});
	
}
window.onload = function () {
	gsap.set('#ad',{duration:0,alpha:1});
	startAd();
};

</script>
